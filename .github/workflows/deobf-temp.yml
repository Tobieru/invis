name: temporary MoonSec deobfuscation
on:
  push:
    branches:
      - deobf-tmp-20260917
    paths-ignore:
      - 'deobf_debug/**'
      - 'deobf_output/**'
permissions:
  contents: write
jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build MoonSec deobfuscator
        continue-on-error: true
        run: |
          set +e
          mkdir -p deobf_debug deobf_output
          {
            echo '=== MoonSec clone ==='
            git clone --depth 1 https://github.com/tupsutumppu/MoonsecDeobfuscator.git /tmp/MoonsecDeobfuscator
            RC=$?
            echo "clone_exit=$RC"
            if [ $RC -eq 0 ]; then
              echo '=== dotnet build ==='
              dotnet build /tmp/MoonsecDeobfuscator -c Release
              RC=$?
              echo "build_exit=$RC"
            fi
            exit 0
          } 2>&1 | tee deobf_debug/01_moonsec_build.log

      - name: Run MoonSec devirtualizer and disassembler
        continue-on-error: true
        run: |
          set +e
          mkdir -p deobf_debug deobf_output
          {
            echo '=== MoonSec -dev ==='
            dotnet run --project /tmp/MoonsecDeobfuscator -c Release --no-build -- -dev -i "$GITHUB_WORKSPACE/3Rnd9rHf.txt" -o "$GITHUB_WORKSPACE/deobf_output/decoded.luac"
            DEV_RC=$?
            echo "dev_exit=$DEV_RC"
            echo '=== MoonSec -dis ==='
            dotnet run --project /tmp/MoonsecDeobfuscator -c Release --no-build -- -dis -i "$GITHUB_WORKSPACE/3Rnd9rHf.txt" -o "$GITHUB_WORKSPACE/deobf_output/disassembly.txt"
            DIS_RC=$?
            echo "dis_exit=$DIS_RC"
            if [ -f "$GITHUB_WORKSPACE/deobf_output/decoded.luac" ]; then
              base64 -w0 "$GITHUB_WORKSPACE/deobf_output/decoded.luac" > "$GITHUB_WORKSPACE/deobf_output/decoded.luac.b64"
              wc -c "$GITHUB_WORKSPACE/deobf_output/decoded.luac" "$GITHUB_WORKSPACE/deobf_output/decoded.luac.b64"
            fi
            exit 0
          } 2>&1 | tee deobf_debug/02_moonsec_run.log

      - name: Build Lua 5.1 and LuaDec without submodules
        continue-on-error: true
        run: |
          set +e
          {
            echo '=== Luadec clone ==='
            rm -rf /tmp/luadec
            git clone --depth 1 https://github.com/viruscamp/luadec.git /tmp/luadec
            RC=$?
            echo "luadec_clone_exit=$RC"
            if [ $RC -eq 0 ]; then
              echo '=== Lua 5.1 clone ==='
              rm -rf /tmp/luadec/lua-5.1
              git clone --depth 1 --branch 5.1 https://github.com/viruscamp/lua5.git /tmp/luadec/lua-5.1
              RC=$?
              echo "lua51_clone_exit=$RC"
            fi
            if [ $RC -eq 0 ]; then
              echo '=== Lua 5.1 build ==='
              cd /tmp/luadec/lua-5.1/src && make generic
              RC=$?
              echo "lua51_build_exit=$RC"
            fi
            if [ $RC -eq 0 ]; then
              echo '=== LuaDec build ==='
              cd /tmp/luadec/luadec && make LUAVER=5.1
              RC=$?
              echo "luadec_build_exit=$RC"
            fi
            exit 0
          } 2>&1 | tee deobf_debug/03_luadec_build.log

      - name: Decompile decoded bytecode
        continue-on-error: true
        run: |
          set +e
          {
            if [ -f "$GITHUB_WORKSPACE/deobf_output/decoded.luac" ] && [ -x /tmp/luadec/luadec/luadec ]; then
              /tmp/luadec/luadec/luadec "$GITHUB_WORKSPACE/deobf_output/decoded.luac" > "$GITHUB_WORKSPACE/deobf_output/deobfuscated.lua"
              echo "luadec_exit=$?"
            else
              echo 'decoded.luac or luadec binary missing; skipping'
              echo 'decoded_exists='$(test -f "$GITHUB_WORKSPACE/deobf_output/decoded.luac" && echo yes || echo no)
              echo 'luadec_exists='$(test -x /tmp/luadec/luadec/luadec && echo yes || echo no)
            fi
            exit 0
          } 2>&1 | tee deobf_debug/04_luadec_run.log

      - name: Collect diagnostics and outputs
        if: always()
        run: |
          set +e
          mkdir -p deobf_debug deobf_output
          {
            echo '=== Environment ==='
            dotnet --info 2>&1
            echo '=== Input ==='
            ls -lh 3Rnd9rHf.txt 2>&1
            echo '=== Outputs ==='
            find deobf_output -maxdepth 1 -type f -printf '%f %s bytes\n' 2>&1
            echo '=== Workspace status ==='
            git status --short 2>&1
          } > deobf_debug/00_summary.log 2>&1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deobf_debug deobf_output
          git commit -m 'tmp: save deobfuscation diagnostics and outputs' || true
          git push || true
