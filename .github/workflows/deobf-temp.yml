name: temporary MoonSec deobfuscation
on:
  push:
    branches:
      - deobf-tmp-20260917
permissions:
  contents: write
jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build MoonSec deobfuscator
        run: |
          git clone --depth 1 https://github.com/tupsutumppu/MoonsecDeobfuscator.git /tmp/MoonsecDeobfuscator
          dotnet build /tmp/MoonsecDeobfuscator -c Release
      - name: Devirtualize
        run: |
          dotnet run --project /tmp/MoonsecDeobfuscator -c Release --no-build -- -dev -i "$GITHUB_WORKSPACE/3Rnd9rHf.txt" -o "$GITHUB_WORKSPACE/decoded.luac"
          dotnet run --project /tmp/MoonsecDeobfuscator -c Release --no-build -- -dis -i "$GITHUB_WORKSPACE/3Rnd9rHf.txt" -o "$GITHUB_WORKSPACE/deobfuscated_disassembly.txt"
      - name: Build Lua 5.1 decompiler
        run: |
          git clone --depth 1 https://github.com/viruscamp/luadec.git /tmp/luadec
          cd /tmp/luadec
          git submodule update --init --depth 1 lua-5.1
          cd lua-5.1
          make linux
          cd ../luadec
          make LUAVER=5.1
      - name: Decompile bytecode
        run: |
          /tmp/luadec/luadec/luadec "$GITHUB_WORKSPACE/decoded.luac" > "$GITHUB_WORKSPACE/deobfuscated.lua"
      - name: Save diagnostics
        if: always()
        run: |
          {
            echo "MoonSec source SHA: 249b030ec6edf9e05e3962cda69dbb29c8b0335d"
            echo "Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "Files:"
            ls -lh 3Rnd9rHf.txt decoded.luac deobfuscated_disassembly.txt deobfuscated.lua 2>&1 || true
          } > deobfuscation.log
      - name: Commit results to temporary branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add decoded.luac deobfuscated_disassembly.txt deobfuscated.lua deobfuscation.log || true
          git commit -m "tmp: deobfuscation result" || true
          git push
