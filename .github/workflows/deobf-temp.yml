name: temporary MoonSec deobfuscation
on:
  push:
    branches:
      - deobf-tmp-20260917
    paths-ignore:
      - 'deobf_debug/**'
      - 'deobf_output/**'
permissions:
  contents: write
jobs:
  deobfuscate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build MoonSec deobfuscator
        run: |
          set -o pipefail
          rm -rf /tmp/MoonsecDeobfuscator
          git clone --depth 1 https://github.com/tupsutumppu/MoonsecDeobfuscator.git /tmp/MoonsecDeobfuscator
          dotnet build /tmp/MoonsecDeobfuscator -c Release 2>&1 | tee build_moonsec.log

      - name: Devirtualize with MoonSec
        run: |
          set -o pipefail
          mkdir -p deobf_output deobf_debug
          {
            echo "=== -dev ==="
            dotnet run --project /tmp/MoonsecDeobfuscator -c Release --no-build -- -dev -i "$GITHUB_WORKSPACE/3Rnd9rHf.txt" -o "$GITHUB_WORKSPACE/deobf_output/decoded.luac"
            echo "dev_exit=$?"
            echo "=== -dis ==="
            dotnet run --project /tmp/MoonsecDeobfuscator -c Release --no-build -- -dis -i "$GITHUB_WORKSPACE/3Rnd9rHf.txt" -o "$GITHUB_WORKSPACE/deobf_output/disassembly.txt"
            echo "dis_exit=$?"
            wc -c "$GITHUB_WORKSPACE/deobf_output/decoded.luac" "$GITHUB_WORKSPACE/deobf_output/disassembly.txt"
          } 2>&1 | tee deobf_debug/02_moonsec_run.log
          base64 -w 0 deobf_output/decoded.luac > deobf_output/decoded.luac.b64

      - name: Build Lua 5.1 + luadec without readline
        run: |
          set -o pipefail
          rm -rf /tmp/luadec
          git clone --depth 1 https://github.com/viruscamp/luadec.git /tmp/luadec
          git clone --depth 1 --branch 5.1 https://github.com/viruscamp/lua5.git /tmp/luadec/lua-5.1
          cd /tmp/luadec/lua-5.1/src
          make generic 2>&1 | tee /tmp/lua51_build.log
          cd ../../luadec
          make LUAVER=5.1 luadec 2>&1 | tee /tmp/luadec_build.log
          cp luadec "$GITHUB_WORKSPACE/deobf_output/luadec"
          {
            echo "=== lua51 ==="
            cat /tmp/lua51_build.log
            echo "=== luadec ==="
            cat /tmp/luadec_build.log
          } > "$GITHUB_WORKSPACE/deobf_debug/03_luadec_build.log"

      - name: Decompile Lua bytecode
        run: |
          set -o pipefail
          /tmp/luadec/luadec/luadec deobf_output/decoded.luac > deobf_output/deobfuscated.lua
          {
            echo "decoded_exists=$(test -f deobf_output/decoded.luac && echo yes || echo no)"
            echo "luadec_exists=$(test -x deobf_output/luadec && echo yes || echo no)"
            echo "lua_size=$(wc -c < deobf_output/decoded.luac)"
            echo "lua_source_size=$(wc -c < deobf_output/deobfuscated.lua)"
          } | tee deobf_debug/04_luadec_run.log

      - name: Verify Lua syntax
        run: |
          /tmp/luadec/lua-5.1/src/luac -p deobf_output/deobfuscated.lua
          {
            echo "=== luac -v ==="
            /tmp/luadec/lua-5.1/src/luac -v
            echo "=== luac -p ==="
            /tmp/luadec/lua-5.1/src/luac -p deobf_output/deobfuscated.lua
          } > deobf_debug/05_syntax.log

      - name: Commit results
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deobf_output deobf_debug
          git commit -m "tmp: verified MoonSec decompilation" || true
          git push
